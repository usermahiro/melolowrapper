name: Build MeloloWrapper

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Source -> build -> release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cek sintaks source
        run: |
          set -euo pipefail
          python3 -m py_compile src/melolo_client.py src/melolo_gui.py
          rm -rf src/__pycache__

      - name: Susun hasil build
        run: |
          set -euo pipefail
          mkdir -p build
          cp src/* build/
          chmod +x build/buka.sh
          cp README.md build/README.md
          ls -la build

      - name: Kemas hasil build
        run: |
          set -euo pipefail
          cd build
          zip -r ../melolowrapper-linux.zip . -x '__pycache__/*'

      - name: Upload artefak build
        uses: actions/upload-artifact@v4
        with:
          name: melolowrapper-linux
          path: melolowrapper-linux.zip

      - name: Push hasil build ke GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG sudah ada, memperbarui aset."
          else
            gh release create "$TAG" \
              --title "MeloloWrapper $TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" melolowrapper-linux.zip --clobber
          gh release view "$TAG"
